name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Windows quality gates
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 11.16.0
        run: npm install --global npm@11.16.0

      - name: Set up Rust 1.96.1
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustup component add rustfmt clippy

      - name: Install locked Node dependencies
        run: npm ci

      - name: Run frontend verification contract
        run: npm run verify

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust without warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run locked Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib
